<script>

function stopMic(){const T=window.TALK;if(T.stream)T.stream.getTracks().forEach(t=>t.stop());if(T.audioCtx&&T.audioCtx.state!=='closed')T.audioCtx.close().catch(()=>{});T.stream=null;T.audioCtx=null;T.analyser=null;T.mode='none';T.active=false;T.amplitude=0;T.smoothAmp=0;document.getElementById('btn-mic').classList.remove('active')}
function toggleSim(){const T=window.TALK;if(T.mode==='mic')stopMic();if(T.mode==='sim'){T.mode='none';T.active=false;T.amplitude=0;T.smoothAmp=0;document.getElementById('btn-sim').classList.remove('active')}else{T.mode='sim';T.active=true;T.simPhase=Math.random()*100;document.getElementById('btn-sim').classList.add('active');document.getElementById('btn-mic').classList.remove('active')}}
function updateTalkAmplitude(){const T=window.TALK;if(T.mode==='mic'&&T.analyser){T.analyser.getByteFrequencyData(T.dataArray);let sum=0;for(let i=0;i<T.dataArray.length;i++)sum+=T.dataArray[i];T.amplitude=Math.min(1,sum/T.dataArray.length/128)}else if(T.mode==='sim'){T.simPhase+=0.018;const p=T.simPhase;const syllable=Math.sin(p*9.2)*.5+.5,word=Math.sin(p*2.6)*.5+.5,breath=Math.sin(p*0.7)*.5+.5,burst=Math.pow(Math.sin(p*15.3)*.5+.5,3),pause=Math.sin(p*0.42)>-.18?1:0;T.amplitude=Math.min(1,(syllable*.38+word*.24+burst*.22+breath*.16)*pause)}else{T.amplitude*=0.90}T.smoothAmp+=(T.amplitude-T.smoothAmp)*0.2;const fill=document.getElementById('amp-fill');if(fill)fill.style.width=(T.smoothAmp*100)+'%'}

document.addEventListener('DOMContentLoaded',()=>{document.getElementById('btn-mic').addEventListener('click',()=>{if(window.TALK.mode==='mic')stopMic();else startMic()});document.getElementById('btn-sim').addEventListener('click',toggleSim)});
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script>
(()=>{'use strict';

[{r:1.02,tube:.009,tilt:[Math.PI/2,.04,0],spd:-.038},{r:1.34,tube:.007,tilt:[Math.PI/2,.04,.07],spd:.032},{r:1.72,tube:.008,tilt:[Math.PI/2,.04,.04],spd:-.028},{r:2.05,tube:.006,tilt:[Math.PI/2,.04,.08],spd:.022}].forEach(({r,tube,tilt,spd})=>{const ring=new THREE.Mesh(new THREE.TorusGeometry(r,tube,6,300),mm(HOT,.28));ring.rotation.set(...tilt);ring.userData.speed=spd;ring.userData.axis=new THREE.Vector3(0,0,1);rings.push(ring);orb.add(ring)});

const circuits=new THREE.Group();orb.add(circuits);for(let i=0;i<420;i++){const rad=.70+rnd()*1.35,ct=2*rnd()-1,st=Math.sqrt(1-ct*ct),ph=rnd()*TAU,p=new THREE.Vector3(rad*st*Math.cos(ph),rad*ct,rad*st*Math.sin(ph)),f=tangentFrame(p),pts=[p.clone()];let a=0,b=0;const steps=2+Math.floor(rnd()*7),scale=.04+rnd()*.09;for(let s=0;s<steps;s++){const d=scale*(.6+rnd()*1.6)*(rnd()<.5?-1:1);if(rnd()<.5)a+=d;else b+=d;pts.push(p.clone().addScaledVector(f.u,a).addScaledVector(f.v,b))}const col=rnd()<.2?BRIGHT:rnd()<.5?HOT:PURPLE;circuits.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),lm(col,.25+rnd()*.5)));if(rnd()<.75){const end=pts[pts.length-1],dot=new THREE.Sprite(new THREE.SpriteMaterial({map:glow,color:HOT,transparent:true,opacity:.5+rnd()*.4,blending:THREE.AdditiveBlending,depthWrite:false}));dot.position.copy(end);dot.scale.setScalar(.018+rnd()*.038);circuits.add(dot)}}
const panels=new THREE.Group();orb.add(panels);for(let i=0;i<280;i++){const ct=2*rnd()-1,st=Math.sqrt(1-ct*ct),ph=rnd()*TAU,dir=new THREE.Vector3(st*Math.cos(ph),ct,st*Math.sin(ph)),baseR=.85+rnd()*.65,depth=.08+rnd()*.32,w=.06+rnd()*.28,h=.025+rnd()*.12,panelGroup=new THREE.Group(),box=new THREE.BoxGeometry(w,h,depth),edges=new THREE.EdgesGeometry(box),col=rnd()<.15?BRIGHT:rnd()<.45?HOT:PURPLE,edgeMesh=new THREE.LineSegments(edges,lm(col,.18+rnd()*.38));panelGroup.add(edgeMesh);panelGroup.position.copy(dir).multiplyScalar(baseR+depth*.5);panelGroup.lookAt(0,0,0);panelGroup.rotateX(Math.PI/2);panelGroup.rotateZ(rnd()*TAU);if(rnd()<.55){const ledgeLen=.04+rnd()*.18,ledgePts=[new THREE.Vector3(0,0,0),new THREE.Vector3((rnd()-.5)*ledgeLen,0,(rnd()-.5)*ledgeLen)];panelGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(ledgePts),lm(DEEP,.3+rnd()*.4)))}panels.add(panelGroup)}
const radial=new THREE.Group();orb.add(radial);for(let i=0;i<220;i++){const ct=2*rnd()-1,st=Math.sqrt(1-ct*ct),ph=rnd()*TAU,dir=new THREE.Vector3(st*Math.cos(ph),ct,st*Math.sin(ph)),a=.18+rnd()*1.1,b=Math.min(2.3,a+.08+rnd()*.7),side=new THREE.Vector3((rnd()-.5)*.1,(rnd()-.5)*.1,(rnd()-.5)*.1),pts=[dir.clone().multiplyScalar(a),dir.clone().multiplyScalar((a+b)*.5).add(side),dir.clone().multiplyScalar(b)];const col=rnd()<.12?HOT:rnd()<.5?PURPLE:DEEP;radial.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),lm(col,.16+rnd()*.38)))}

// Purple particle colors

<script>
(()=>{
  const canvas=document.createElement('canvas');canvas.className='detail2d';document.querySelector('.room').appendChild(canvas);const ctx=canvas.getContext('2d');
  let dpr=1,w=0,h=0,cx=0,cy=0,R=0;

    for(let i=0;i<Math.floor(55*amount);i++){const rr=85+q()*360,flat=.16+q()*.74,rot=q()*Math.PI,span=.28+q()*5.2,start=q()*Math.PI*2;g.save();g.rotate(rot);g.beginPath();g.ellipse(0,0,rr,rr*flat,0,start,start+span);g.strokeStyle=`rgba(${120+q()*60|0},${40+q()*60|0},255,${.07+q()*.28})`;g.lineWidth=.5+q()*2.4;g.stroke();g.restore()}

    // Circuit traces — purple
    for(let i=0;i<Math.floor(560*amount);i++){const a=q()*Math.PI*2,r=Math.sqrt(q())*S*.98,x=Math.cos(a)*r,y=Math.sin(a)*r,steps=2+(q()*8|0),unit=5+q()*20;let px=x,py=y;g.beginPath();g.moveTo(px,py);for(let j=0;j<steps;j++){if(q()<.5)px+=(q()<.5?-1:1)*unit*(.4+q());else py+=(q()<.5?-1:1)*unit*(.4+q());if(px*px+py*py>S*S*.99)break;g.lineTo(px,py)}const hot=q();g.strokeStyle=`rgba(${110+hot*80|0},${30+hot*70|0},255,${.11+q()*.50})`;g.lineWidth=.4+q()*1.6;g.stroke();if(q()<.55){g.fillStyle=`rgba(${150+q()*60|0},${60+q()*60|0},255,${.22+q()*.55})`;g.fillRect(px-1-q(),py-1-q(),2+q()*2.6,2+q()*2.6)}}

    for(let i=0;i<36;i++){const a=q()*Math.PI*2,r1=400+q()*26,r2=r1+14+q()*55,k=(q()-.5)*18;g.beginPath();g.moveTo(Math.cos(a)*r1,Math.sin(a)*r1);g.lineTo(Math.cos(a)*r2-k*Math.sin(a),Math.sin(a)*r2+k*Math.cos(a));if(q()<.6)g.lineTo(Math.cos(a)*r2-k*Math.sin(a)+(q()<.5?-1:1)*(8+q()*20),Math.sin(a)*r2+k*Math.cos(a));g.strokeStyle=`rgba(${110+q()*60|0},${30+q()*50|0},255,${.07+q()*.28})`;g.lineWidth=.5+q()*1.8;g.stroke()}

  }
  const far=layer(0x93a18c,1),mid=layer(0x41bcf9,.84),near=layer(0xd7c031,.65);
  function resize(){dpr=Math.min(devicePixelRatio,1.75);w=innerWidth;h=innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;canvas.style.width=w+'px';canvas.style.height=h+'px';cx=w*.49;cy=h*.515;R=Math.min(w,h)*.47}
  function stamp(img,angle,alpha,blur,scale){ctx.save();ctx.translate(cx,cy);ctx.rotate(angle);ctx.globalAlpha=alpha;ctx.globalCompositeOperation='lighter';ctx.filter=blur?'blur('+blur+'px)':'none';const r=R*scale;ctx.drawImage(img,-r,-r,r*2,r*2);ctx.restore()}
  function hotspots(t,amp){
    const spots=[[-.48,-.55,.13,.26],[.06,-.72,.11,.24],[.58,-.22,.13,.22],[.56,.43,.14,.26],[-.42,.49,.13,.22],[-.66,-.05,.11,.19]];
    ctx.save();ctx.translate(cx,cy);ctx.globalCompositeOperation='lighter';
    for(let i=0;i<spots.length;i++){
      const s=spots[i],px=s[0]*R,py=s[1]*R;
      const sizeBoost=1+amp*.6;
      const rr=s[2]*R*(1+Math.sin(t*.8+i)*.04)*sizeBoost;
      const alphaBoost=s[3]+amp*.3;
      const gr=ctx.createRadialGradient(px,py,0,px,py,rr);
      gr.addColorStop(0,'rgba(180,120,255,'+alphaBoost+')');
      gr.addColorStop(.28,'rgba(120,50,220,'+(alphaBoost*.7)+')');
      gr.addColorStop(1,'rgba(80,20,180,0)');
      ctx.fillStyle=gr;ctx.beginPath();ctx.arc(px,py,rr,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
  }
  function drawCore(t,amp){
    ctx.save();ctx.translate(cx,cy);ctx.globalCompositeOperation='lighter';
    const glowR=R*(.07+amp*.12);const glowA=.22+amp*.55;
    const gr=ctx.createRadialGradient(0,0,0,0,0,glowR);
    gr.addColorStop(0,'rgba(210,180,255,'+glowA+')');
    gr.addColorStop(.22,'rgba(140,60,220,'+(glowA*.45)+')');
    gr.addColorStop(1,'rgba(80,20,180,0)');
    ctx.fillStyle=gr;ctx.beginPath();ctx.arc(0,0,glowR,0,Math.PI*2);ctx.fill();
    ctx.shadowColor='#aa55ff';ctx.shadowBlur=10+amp*22;
    const speedMult=1+amp*3;
    for(let i=0;i<5;i++){
      ctx.beginPath();
      ctx.arc(0,0,R*(.032+i*.018),t*(i%2?-.52:.40)*speedMult+i*.8,t*(i%2?-.52:.40)*speedMult+4.50+i*.42);
      const ringAlpha=(.44+i*.08)+amp*.35;
      ctx.strokeStyle='rgba('+(150+i*16)+','+(80+i*14)+',255,'+ringAlpha+')';
      ctx.lineWidth=(1.0+i*.38)+amp*2;ctx.stroke();
    }
    ctx.beginPath();ctx.moveTo(-R*.36,0);ctx.lineTo(-R*.11,0);ctx.moveTo(R*.11,0);ctx.lineTo(R*.48,0);
    ctx.strokeStyle='rgba(160,80,255,'+(0.36+amp*.4)+')';ctx.lineWidth=1.3+amp*1.5;ctx.stroke();
    ctx.restore();
  }
  function semiRing(t,front,amp){
    const rotation=t*.33-.58,start=front?.14:Math.PI*1.04,end=front?Math.PI*1.04:Math.PI*2-.14;
    ctx.save();ctx.translate(cx,cy);ctx.rotate(rotation);ctx.globalCompositeOperation='lighter';
    ctx.shadowColor='#aa55ff';ctx.shadowBlur=(front?20:8)+amp*18;
    if(front){ctx.save();ctx.rotate(-.016);ctx.beginPath();ctx.ellipse(0,0,R*.68,R*.53,0,start,end);
      ctx.strokeStyle='rgba(120,40,220,'+(0.14+amp*.2)+')';ctx.lineWidth=9+amp*5;ctx.stroke();ctx.restore()}
    ctx.beginPath();ctx.ellipse(0,0,R*.68,R*.53,0,start,end);
    ctx.strokeStyle=front?'rgba(180,100,255,'+(0.70+amp*.25)+')':'rgba(120,50,220,'+(0.16+amp*.12)+')';
    ctx.lineWidth=(front?3.2:1.3)+amp*2;ctx.stroke();
    if(front){ctx.beginPath();ctx.ellipse(0,0,R*.68,R*.53,0,.28,.74);
      ctx.strokeStyle='rgba(210,170,255,'+(0.74+amp*.2)+')';ctx.lineWidth=1.3+amp*1.5;ctx.stroke()}
    ctx.restore();
  }
  function talkPulseRings(t,amp){
    if(amp<.08)return;
    ctx.save();ctx.translate(cx,cy);ctx.globalCompositeOperation='lighter';
    for(let i=0;i<4;i++){
      const phase=t*5.5+i*1.57;const r=R*(.06+((phase%3.14)/3.14)*.28);

  }
  function frame(ms){
    const t=ms*.001;const amp=window.TALK?window.TALK.smoothAmp:0;
    ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);

  }
  resize();addEventListener('resize',resize);requestAnimationFrame(frame);
})();
