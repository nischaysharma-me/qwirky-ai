<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JARVIS — Holographic Orb</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #06080f;
      overflow: hidden;
      font-family: 'Courier New', monospace;
    }
    canvas { display: block; }

    /* HUD overlay */
    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }

    /* Corner brackets */
    .bracket {
      position: absolute;
      width: 60px; height: 60px;
      border-color: rgba(255,180,0,0.5);
      border-style: solid;
    }
    .bracket.tl { top:20px; left:20px;  border-width: 2px 0 0 2px; }
    .bracket.tr { top:20px; right:20px; border-width: 2px 2px 0 0; }
    .bracket.bl { bottom:20px; left:20px;  border-width: 0 0 2px 2px; }
    .bracket.br { bottom:20px; right:20px; border-width: 0 2px 2px 0; }

    /* Status panel */
    #status {
      position: absolute;
      top: 30px; left: 90px;
      color: rgba(255,200,50,0.85);
      font-size: 11px;
      line-height: 1.8;
      text-shadow: 0 0 8px rgba(255,180,0,0.8);
    }
    #status .label { color: rgba(255,180,0,0.4); font-size: 9px; letter-spacing: 2px; text-transform: uppercase; }

    /* Bottom panel */
    #bottom {
      position: absolute;
      bottom: 30px; left: 90px; right: 90px;
      display: flex; justify-content: space-between; align-items: flex-end;
    }
    .data-col { color: rgba(255,200,50,0.7); font-size: 10px; line-height: 2; }
    .data-col .label { color: rgba(255,180,0,0.35); font-size: 8px; letter-spacing: 2px; }

    /* Centre scan-line ring */
    #scanring {
      position: absolute;
      top:50%; left:50%;
      transform: translate(-50%,-50%);
      width: 320px; height: 320px;
      border-radius: 50%;
      border: 1px solid rgba(255,180,0,0.15);
      pointer-events: none;
    }
    #scanring::before {
      content:'';
      position: absolute;
      inset: 16px;
      border-radius: 50%;
      border: 1px solid rgba(255,180,0,0.08);
    }

    /* Title */
    #title {
      position: absolute;
      top: 30px; right: 90px;
      text-align: right;
      color: rgba(255,200,50,0.8);
      font-size: 18px;
      letter-spacing: 6px;
      text-transform: uppercase;
      text-shadow: 0 0 15px rgba(255,180,0,0.9);
    }
    #title span { display: block; font-size: 9px; letter-spacing: 4px; color: rgba(255,180,0,0.4); margin-top: 4px; }

    /* Interaction hint */
    #hint {
      position: absolute;
      bottom: 30px; right: 90px;
      color: rgba(255,180,0,0.3);
      font-size: 9px;
      letter-spacing: 2px;
      text-align: right;
    }

    /* Pulse indicator */
    #pulse {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      width: 8px; height: 8px;
      background: rgba(255,200,0,0.9);
      border-radius: 50%;
      box-shadow: 0 0 12px rgba(255,200,0,0.8);
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { transform: translate(-50%,-50%) scale(1); opacity:1; }
      50%      { transform: translate(-50%,-50%) scale(2.5); opacity:0.3; }
    }
  </style>
</head>
<body>

<div id="hud">
  <div class="bracket tl"></div>
  <div class="bracket tr"></div>
  <div class="bracket bl"></div>
  <div class="bracket br"></div>

  <div id="title">JARVIS<span>AI CORE v7.4.2</span></div>

  <div id="status">
    <div class="label">System Status</div>
    <div id="stat-power">PWR ██████████ 100%</div>
    <div id="stat-neural">NET ████████░░ <span id="net-val">82%</span></div>
    <div id="stat-scan">SCN ██████░░░░ <span id="scn-val">61%</span></div>
    <div style="margin-top:8px;" class="label">Coordinates</div>
    <div id="coord">X:<span id="cx">0.000</span> Y:<span id="cy">0.000</span></div>
  </div>

  <div id="scanring"></div>
  <div id="pulse"></div>

  <div id="bottom">
    <div class="data-col">
      <div class="label">Particles</div>
      <div id="particles-count">4 800</div>
      <div class="label" style="margin-top:6px;">Rings Active</div>
      <div>12 / 12</div>
    </div>
    <div class="data-col" style="text-align:center;">
      <div class="label">Energy Output</div>
      <div id="energy">3.72 TW</div>
      <div style="margin-top:6px;color:rgba(255,180,0,0.25);font-size:8px;letter-spacing:3px;">HOLOGRAPHIC MATRIX STABLE</div>
    </div>
    <div class="data-col" style="text-align:right;">
      <div class="label">Rotation</div>
      <div id="rot-val">AUTO</div>
      <div class="label" style="margin-top:6px;">Mode</div>
      <div id="mode-val">ANALYSE</div>
    </div>
  </div>

  <div id="hint">DRAG TO ROTATE &nbsp;·&nbsp; SCROLL TO ZOOM &nbsp;·&nbsp; CLICK TO PULSE</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ─── Scene Setup ────────────────────────────────────────────────────────────
const W = window.innerWidth, H = window.innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(W, H);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x06080f, 1);
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, W / H, 0.1, 1000);
camera.position.set(0, 0, 5);

scene.fog = new THREE.FogExp2(0x06080f, 0.06);

// ─── Colours ────────────────────────────────────────────────────────────────
const GOLD  = new THREE.Color(0xffa500);
const GOLD2 = new THREE.Color(0xffcc00);
const GOLD3 = new THREE.Color(0xff6600);

// ─── Helpers ────────────────────────────────────────────────────────────────
function lineMat(opacity = 0.7) {
  return new THREE.LineBasicMaterial({
    color: GOLD2,
    transparent: true,
    opacity,
  });
}

// ─── Lighting ────────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x0a0a20, 1));

const pointCore = new THREE.PointLight(GOLD2, 6, 8);
scene.add(pointCore);

const blueRim = new THREE.PointLight(0x2244aa, 2, 10);
blueRim.position.set(-4, 2, -3);
scene.add(blueRim);

// ─── Orb Root ────────────────────────────────────────────────────────────────
const orb = new THREE.Group();
scene.add(orb);

// ─── Core Sphere ─────────────────────────────────────────────────────────────
const core = new THREE.Mesh(
  new THREE.SphereGeometry(0.18, 32, 32),
  new THREE.MeshStandardMaterial({
    color: 0xffdd88, emissive: 0xffaa00, emissiveIntensity: 4, metalness: 1, roughness: 0,
  })
);
orb.add(core);

// Inner glow
orb.add(new THREE.Mesh(
  new THREE.SphereGeometry(0.35, 24, 24),
  new THREE.MeshStandardMaterial({
    color: 0xffcc44, emissive: 0xff8800, emissiveIntensity: 2,
    transparent: true, opacity: 0.25, side: THREE.BackSide,
  })
));

// ─── Rings ───────────────────────────────────────────────────────────────────
const ringData = [
  { r: 0.5,  tube: 0.008, tilt: [0, 0, 0],                      speed: 0.6  },
  { r: 0.65, tube: 0.006, tilt: [Math.PI/2, 0, 0],              speed: -0.4 },
  { r: 0.65, tube: 0.006, tilt: [0, 0, Math.PI/3],              speed: 0.5  },
  { r: 0.8,  tube: 0.007, tilt: [Math.PI/6, 0, 0],             speed: -0.3 },
  { r: 0.8,  tube: 0.005, tilt: [0, Math.PI/4, 0],             speed: 0.35 },
  { r: 0.95, tube: 0.006, tilt: [Math.PI/4, 0, 0],             speed: -0.25},
  { r: 0.95, tube: 0.004, tilt: [0, 0, Math.PI/5],             speed: 0.28 },
  { r: 1.1,  tube: 0.007, tilt: [Math.PI/3, 0, 0],             speed: 0.2  },
  { r: 1.1,  tube: 0.005, tilt: [0, Math.PI/6, 0],             speed: -0.22},
  { r: 1.25, tube: 0.006, tilt: [Math.PI/5, Math.PI/5, 0],     speed: 0.15 },
  { r: 1.25, tube: 0.004, tilt: [0, Math.PI/3, Math.PI/4],     speed: -0.18},
  { r: 1.4,  tube: 0.005, tilt: [Math.PI/8, 0, Math.PI/6],     speed: 0.12 },
];

const rings = ringData.map(({ r, tube, tilt, speed }) => {
  const mesh = new THREE.Mesh(
    new THREE.TorusGeometry(r, tube, 8, 120),
    new THREE.MeshStandardMaterial({
      color: GOLD2, emissive: GOLD, emissiveIntensity: 1.5,
      metalness: 0.9, roughness: 0.1,
      transparent: true, opacity: 0.75 + Math.random() * 0.25,
    })
  );
  mesh.rotation.set(...tilt);
  mesh.userData.speed = speed;
  orb.add(mesh);
  return mesh;
});

// ─── Lattice ─────────────────────────────────────────────────────────────────
function buildLattice(radius, segments, opacity) {
  const group = new THREE.Group();
  for (let i = 1; i < segments; i++) {
    const lat = (i / segments) * Math.PI - Math.PI / 2;
    const r = Math.cos(lat) * radius;
    const y = Math.sin(lat) * radius;
    const pts = [];
    for (let j = 0; j <= 64; j++) {
      const a = (j / 64) * Math.PI * 2;
      pts.push(new THREE.Vector3(Math.cos(a) * r, y, Math.sin(a) * r));
    }
    group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), lineMat(opacity)));
  }
  for (let i = 0; i < segments * 2; i++) {
    const lon = (i / (segments * 2)) * Math.PI * 2;
    const pts = [];
    for (let j = 0; j <= 32; j++) {
      const lat = (j / 32) * Math.PI - Math.PI / 2;
      pts.push(new THREE.Vector3(
        Math.cos(lat) * Math.cos(lon) * radius,
        Math.sin(lat) * radius,
        Math.cos(lat) * Math.sin(lon) * radius
      ));
    }
    group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), lineMat(opacity * 0.5)));
  }
  return group;
}

const lattice1 = buildLattice(0.82, 10, 0.25);
lattice1.userData.speed = { x: 0.08, y: 0.12 };
orb.add(lattice1);

const lattice2 = buildLattice(1.3, 8, 0.12);
lattice2.userData.speed = { x: -0.06, y: 0.09 };
orb.add(lattice2);

// ─── Circuit Fragments ───────────────────────────────────────────────────────
const circuitGroup = new THREE.Group();
for (let i = 0; i < 80; i++) {
  const radius = 0.6 + Math.random() * 0.85;
  const phi = Math.random() * Math.PI * 2;
  const theta = Math.random() * Math.PI;
  const cx = Math.sin(theta) * Math.cos(phi) * radius;
  const cy = Math.cos(theta) * radius;
  const cz = Math.sin(theta) * Math.sin(phi) * radius;

  const frag = new THREE.Group();
  const steps = 3 + Math.floor(Math.random() * 5);
  const pts = [new THREE.Vector3(0, 0, 0)];
  let x = 0, y = 0;
  for (let s = 0; s < steps; s++) {
    const axis = Math.random() < 0.5 ? 'x' : 'y';
    const dist = (0.04 + Math.random() * 0.12) * (Math.random() < 0.5 ? 1 : -1);
    if (axis === 'x') x += dist; else y += dist;
    pts.push(new THREE.Vector3(x, y, 0));
  }
  frag.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), lineMat(0.4 + Math.random() * 0.5)));

  [pts[0], pts[pts.length-1]].forEach(p => {
    const dot = new THREE.Mesh(
      new THREE.SphereGeometry(0.008, 4, 4),
      new THREE.MeshStandardMaterial({ color: GOLD2, emissive: GOLD, emissiveIntensity: 3 })
    );
    dot.position.copy(p);
    frag.add(dot);
  });

  frag.position.set(cx, cy, cz);
  frag.lookAt(0, 0, 0);
  frag.rotateY(Math.PI);
  circuitGroup.add(frag);
}
circuitGroup.userData.speed = { x: 0.03, y: 0.05 };
orb.add(circuitGroup);

// ─── Particles ───────────────────────────────────────────────────────────────
const PARTICLE_COUNT = 4800;
const positions = new Float32Array(PARTICLE_COUNT * 3);
const pColors   = new Float32Array(PARTICLE_COUNT * 3);
const pSpeeds   = new Float32Array(PARTICLE_COUNT * 3);
const pRadii    = new Float32Array(PARTICLE_COUNT);

for (let i = 0; i < PARTICLE_COUNT; i++) {
  const radius = 0.5 + Math.random() * 1.1;
  pRadii[i] = radius;
  const theta = Math.acos(2 * Math.random() - 1);
  const phi   = Math.random() * Math.PI * 2;
  positions[i*3]   = radius * Math.sin(theta) * Math.cos(phi);
  positions[i*3+1] = radius * Math.cos(theta);
  positions[i*3+2] = radius * Math.sin(theta) * Math.sin(phi);
  const c = new THREE.Color().lerpColors(GOLD3, GOLD2, Math.random());
  pColors[i*3]   = c.r;
  pColors[i*3+1] = c.g;
  pColors[i*3+2] = c.b;
  pSpeeds[i*3]   = (Math.random() - 0.5) * 0.002;
  pSpeeds[i*3+1] = (Math.random() - 0.5) * 0.002;
  pSpeeds[i*3+2] = (Math.random() - 0.5) * 0.002;
}

const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
pGeo.setAttribute('color',    new THREE.BufferAttribute(pColors, 3));
orb.add(new THREE.Points(pGeo, new THREE.PointsMaterial({
  size: 0.025, vertexColors: true, transparent: true, opacity: 0.85, sizeAttenuation: true,
})));

// ─── Energy Streaks ──────────────────────────────────────────────────────────
const streakGroup = new THREE.Group();
for (let i = 0; i < 60; i++) {
  const phi   = Math.random() * Math.PI * 2;
  const theta = Math.acos(2 * Math.random() - 1);
  const r1 = 1.4 + Math.random() * 0.3;
  const dir = new THREE.Vector3(Math.sin(theta)*Math.cos(phi), Math.cos(theta), Math.sin(theta)*Math.sin(phi));
  const start = dir.clone().multiplyScalar(0.2);
  const end   = dir.clone().multiplyScalar(r1);
  const rnd = () => (Math.random()-0.5)*0.3;
  const mid1 = dir.clone().multiplyScalar(0.2+(r1-0.2)*0.33).add(new THREE.Vector3(rnd(),rnd(),rnd()));
  const mid2 = dir.clone().multiplyScalar(0.2+(r1-0.2)*0.66).add(new THREE.Vector3(rnd(),rnd(),rnd()));
  const pts = new THREE.CatmullRomCurve3([start, mid1, mid2, end]).getPoints(30);
  streakGroup.add(new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color: GOLD2, transparent: true, opacity: 0.15 + Math.random() * 0.35 })
  ));
}
streakGroup.userData.speed = { x: 0.02, y: -0.04 };
orb.add(streakGroup);

// ─── Stars ───────────────────────────────────────────────────────────────────
const starPos = new Float32Array(3000 * 3);
const starCol = new Float32Array(3000 * 3);
for (let i = 0; i < 3000; i++) {
  const r = 30 + Math.random() * 30;
  const t = Math.acos(2*Math.random()-1), p = Math.random()*Math.PI*2;
  starPos[i*3]=r*Math.sin(t)*Math.cos(p); starPos[i*3+1]=r*Math.cos(t); starPos[i*3+2]=r*Math.sin(t)*Math.sin(p);
  const b = Math.random() < 0.4;
  starCol[i*3]=b?0.3:0.9; starCol[i*3+1]=b?0.5:0.85; starCol[i*3+2]=b?1:0.5;
}
const sGeo = new THREE.BufferGeometry();
sGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
sGeo.setAttribute('color',    new THREE.BufferAttribute(starCol, 3));
scene.add(new THREE.Points(sGeo, new THREE.PointsMaterial({ size: 0.12, vertexColors: true, transparent: true, opacity: 0.4 })));

// ─── Interaction ─────────────────────────────────────────────────────────────
let isDragging = false, prevMouse = { x:0, y:0 };
let targetRot = { x:0, y:0 }, currentRot = { x:0, y:0 };
let autoRotate = true, zoomTarget = 5, currentZoom = 5;
let pulseActive = false, pulseTime = 0;
const pulseRings = [];

document.addEventListener('mousedown', e => {
  isDragging = true; autoRotate = false;
  prevMouse = { x: e.clientX, y: e.clientY };
  document.getElementById('rot-val').textContent = 'MANUAL';
  document.getElementById('mode-val').textContent = 'CONTROL';
});
document.addEventListener('mousemove', e => {
  document.getElementById('cx').textContent = ((e.clientX/innerWidth - 0.5)*2).toFixed(3);
  document.getElementById('cy').textContent = ((e.clientY/innerHeight - 0.5)*-2).toFixed(3);
  if (!isDragging) return;
  targetRot.y += (e.clientX - prevMouse.x) * 0.006;
  targetRot.x += (e.clientY - prevMouse.y) * 0.006;
  prevMouse = { x: e.clientX, y: e.clientY };
});
document.addEventListener('mouseup', () => {
  isDragging = false;
  setTimeout(() => { autoRotate = true; document.getElementById('rot-val').textContent='AUTO'; document.getElementById('mode-val').textContent='ANALYSE'; }, 3000);
});
document.addEventListener('wheel', e => {
  zoomTarget = Math.max(2.5, Math.min(9, zoomTarget + e.deltaY * 0.005));
}, { passive: true });
document.addEventListener('click', () => { pulseActive = true; pulseTime = 0; });

function triggerPulse() {
  const ring = new THREE.Mesh(
    new THREE.RingGeometry(0.05, 0.09, 64),
    new THREE.MeshBasicMaterial({ color: GOLD2, transparent: true, opacity: 0.9, side: THREE.DoubleSide })
  );
  ring.userData.birth = Date.now();
  scene.add(ring);
  pulseRings.push(ring);
}

// ─── HUD tick ────────────────────────────────────────────────────────────────
let hudTimer = 0;
function updateHUD(dt) {
  hudTimer += dt;
  if (hudTimer > 0.25) {
    hudTimer = 0;
    document.getElementById('net-val').textContent  = (78 + Math.random()*8).toFixed(0)+'%';
    document.getElementById('scn-val').textContent  = (55 + Math.random()*15).toFixed(0)+'%';
    document.getElementById('energy').textContent   = (3.5 + Math.random()*0.5).toFixed(2)+' TW';
  }
}

// ─── Animation ───────────────────────────────────────────────────────────────
const clock = new THREE.Clock();
let autoAngle = 0;
const posAttr = pGeo.attributes.position;

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const elapsed = clock.getElapsedTime();

  if (autoRotate) {
    autoAngle += dt * 0.18;
    targetRot.y = autoAngle;
    targetRot.x = Math.sin(elapsed * 0.15) * 0.2;
  }
  currentRot.x += (targetRot.x - currentRot.x) * 0.05;
  currentRot.y += (targetRot.y - currentRot.y) * 0.05;
  orb.rotation.x = currentRot.x;
  orb.rotation.y = currentRot.y;

  currentZoom += (zoomTarget - currentZoom) * 0.06;
  camera.position.z = currentZoom;

  rings.forEach(r => { r.rotation.z += r.userData.speed * dt; });
  [lattice1, lattice2, circuitGroup, streakGroup].forEach(g => {
    g.rotation.x += (g.userData.speed.x||0) * dt;
    g.rotation.y += (g.userData.speed.y||0) * dt;
  });

  core.scale.setScalar(1 + Math.sin(elapsed * 4) * 0.12);
  pointCore.intensity = 5 + Math.sin(elapsed * 3) * 2;

  // particle drift
  for (let i = 0; i < PARTICLE_COUNT; i += 6) {
    const ix=i*3, iy=i*3+1, iz=i*3+2;
    posAttr.array[ix] += pSpeeds[ix];
    posAttr.array[iy] += pSpeeds[iy];
    posAttr.array[iz] += pSpeeds[iz];
    const nr = Math.sqrt(posAttr.array[ix]**2+posAttr.array[iy]**2+posAttr.array[iz]**2);
    if (nr > 0) {
      const s = pRadii[i] / nr;
      posAttr.array[ix]*=s; posAttr.array[iy]*=s; posAttr.array[iz]*=s;
    }
  }
  posAttr.needsUpdate = true;

  // pulse
  if (pulseActive) {
    pulseTime += dt;
    if (pulseTime < 0.08) { triggerPulse(); }
    if (pulseTime > 0.5) pulseActive = false;
  }
  for (let i = pulseRings.length-1; i >= 0; i--) {
    const pr = pulseRings[i];
    const prog = (Date.now() - pr.userData.birth) / 1200;
    pr.scale.setScalar(1 + prog * 25);
    pr.material.opacity = 0.8 * (1 - prog);
    pr.rotation.x = currentRot.x; pr.rotation.y = currentRot.y;
    if (prog >= 1) { scene.remove(pr); pulseRings.splice(i,1); }
  }

  updateHUD(dt);
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
