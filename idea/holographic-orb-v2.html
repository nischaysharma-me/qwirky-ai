<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>JARVIS · Neural Core</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#040610;overflow:hidden;font-family:'Courier New',monospace}
canvas{display:block}

#hud{position:fixed;inset:0;pointer-events:none;z-index:10}

/* Corners */
.corner{position:absolute;width:72px;height:72px;border-style:solid;
  border-color:rgba(255,170,0,.55);animation:cpulse 3s ease-in-out infinite}
@keyframes cpulse{0%,100%{border-color:rgba(255,170,0,.55)}50%{border-color:rgba(255,230,100,.9)}}
.tl{top:18px;left:18px;border-width:2px 0 0 2px}
.tr{top:18px;right:18px;border-width:2px 2px 0 0}
.bl{bottom:18px;left:18px;border-width:0 0 2px 2px}
.br{bottom:18px;right:18px;border-width:0 2px 2px 0}
.corner::after{content:'';position:absolute;width:7px;height:7px;
  background:rgba(255,200,50,.9);border-radius:50%;
  box-shadow:0 0 8px rgba(255,200,0,.8)}
.tl::after{top:-3px;left:-3px}.tr::after{top:-3px;right:-3px}
.bl::after{bottom:-3px;left:-3px}.br::after{bottom:-3px;right:-3px}

/* Scan line */
#scanline{position:absolute;top:0;left:0;width:100%;height:2px;
  background:linear-gradient(90deg,transparent,rgba(255,200,50,.35),transparent);
  animation:scan 5s linear infinite;pointer-events:none}
@keyframes scan{0%{top:0}100%{top:100%}}

/* Title */
#title{position:absolute;top:26px;left:50%;transform:translateX(-50%);
  text-align:center;color:rgba(255,215,60,.9);font-size:24px;letter-spacing:10px;
  text-transform:uppercase;text-shadow:0 0 18px rgba(255,180,0,1),0 0 40px rgba(255,100,0,.5)}
#title .sub{display:block;font-size:8px;letter-spacing:5px;
  color:rgba(255,180,0,.35);margin-top:5px}

/* Panels */
.plabel{font-size:8px;letter-spacing:3px;color:rgba(255,150,0,.35);
  text-transform:uppercase;margin-bottom:2px}
#left{position:absolute;top:115px;left:26px;color:rgba(255,205,65,.8);
  font-size:10px;line-height:2.1}
#right{position:absolute;top:115px;right:26px;text-align:right;
  color:rgba(255,205,65,.8);font-size:10px;line-height:2.1}

/* Progress bars */
.bar{display:inline-block;width:80px;height:4px;
  background:rgba(255,80,0,.12);border-radius:2px;overflow:hidden;
  vertical-align:middle;margin:0 5px}
.bf{height:100%;border-radius:2px;
  background:linear-gradient(90deg,#ff5500,#ffcc00);
  box-shadow:0 0 5px rgba(255,200,0,.7);transition:width .3s ease}

/* Centre ring + crosshair */
#ring{position:absolute;top:50%;left:50%;
  width:300px;height:300px;border-radius:50%;
  border:1px solid rgba(255,170,0,.12);
  transform:translate(-50%,-50%);pointer-events:none}
#ring::before{content:'';position:absolute;inset:20px;
  border-radius:50%;border:1px solid rgba(255,170,0,.06)}
#ring::after{content:'';position:absolute;inset:-22px;
  border-radius:50%;border:1px solid rgba(255,170,0,.04)}
#cross{position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);width:280px;height:280px}
#cross::before{content:'';position:absolute;
  top:50%;left:8%;right:8%;height:1px;background:rgba(255,170,0,.12)}
#cross::after{content:'';position:absolute;
  left:50%;top:8%;bottom:8%;width:1px;background:rgba(255,170,0,.12)}

/* Pulse dot */
#pd{position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:10px;height:10px;border-radius:50%;
  background:rgba(255,230,80,1);
  box-shadow:0 0 14px rgba(255,220,0,1),0 0 30px rgba(255,140,0,.6);
  animation:pd 1.6s ease-in-out infinite}
@keyframes pd{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:1}
  50%{transform:translate(-50%,-50%) scale(3.5);opacity:.15}}

/* Bottom */
#bottom{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);
  text-align:center;color:rgba(255,180,0,.25);font-size:8px;letter-spacing:3px}
#coords{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);
  color:rgba(255,180,0,.28);font-size:9px;letter-spacing:2px}
</style>
</head>
<body>

<div id="hud">
  <div class="corner tl"></div><div class="corner tr"></div>
  <div class="corner bl"></div><div class="corner br"></div>
  <div id="scanline"></div>
  <div id="title">JARVIS<span class="sub">NEURAL CORE · v9.1.4 · HOLOGRAPHIC MATRIX ACTIVE</span></div>

  <div id="left">
    <div class="plabel">System Vitals</div>
    <div>PWR <span class="bar"><span class="bf" id="pwr-bar" style="width:100%"></span></span><span id="pwr-val">100%</span></div>
    <div>NET <span class="bar"><span class="bf" id="net-bar" style="width:82%"></span></span><span id="net-val">82%</span></div>
    <div>SCN <span class="bar"><span class="bf" id="scn-bar" style="width:65%"></span></span><span id="scn-val">65%</span></div>
    <div>MEM <span class="bar"><span class="bf" id="mem-bar" style="width:91%"></span></span><span id="mem-val">91%</span></div>
    <div style="margin-top:10px" class="plabel">Particle Matrix</div>
    <div>ACTIVE <span style="color:rgba(255,225,80,.9)">20 000</span></div>
    <div>RINGS &nbsp;<span style="color:rgba(255,225,80,.9)">10 / 10</span></div>
    <div>LAYERS <span style="color:rgba(255,225,80,.9)">4</span></div>
  </div>

  <div id="right">
    <div class="plabel">Core Metrics</div>
    <div><span id="energy">3.72</span> TW OUTPUT</div>
    <div><span id="temp">8512</span> K SURFACE</div>
    <div><span id="freq">2.41</span> GHz SYNC</div>
    <div style="margin-top:10px" class="plabel">Control</div>
    <div id="mode-val" style="color:rgba(255,225,80,.9)">ANALYSE</div>
    <div id="rot-val" style="color:rgba(255,180,0,.45);font-size:9px">AUTO ROTATE</div>
  </div>

  <div id="ring"></div>
  <div id="cross"></div>
  <div id="pd"></div>
  <div id="coords">X:<span id="cx">0.000</span> &nbsp; Y:<span id="cy">0.000</span></div>
  <div id="bottom">DRAG · SCROLL · CLICK TO PULSE</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';

// ─────────────────────────────────────────────────────────────────────────────
//  GLSL SNIPPETS
// ─────────────────────────────────────────────────────────────────────────────
const SIMPLEX3 = `
vec3 _m289v3(vec3 x){return x-floor(x*(1./289.))*289.;}
vec4 _m289v4(vec4 x){return x-floor(x*(1./289.))*289.;}
vec4 _perm(vec4 x){return _m289v4(((x*34.)+1.)*x);}
vec4 _tiSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1./6.,1./3.);
  const vec4 D=vec4(0.,.5,1.,2.);
  vec3 i=floor(v+dot(v,C.yyy));
  vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz);
  vec3 l=1.-g;
  vec3 i1=min(g.xyz,l.zxy);
  vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx;
  vec3 x2=x0-i2+C.yyy;
  vec3 x3=x0-D.yyy;
  i=_m289v3(i);
  vec4 p=_perm(_perm(_perm(
    i.z+vec4(0.,i1.z,i2.z,1.))
    +i.y+vec4(0.,i1.y,i2.y,1.))
    +i.x+vec4(0.,i1.x,i2.x,1.));
  float n_=0.142857142857;
  vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.*floor(p*ns.z*ns.z);
  vec4 x_=floor(j*ns.z);
  vec4 y_=floor(j-7.*x_);
  vec4 x=x_*ns.x+ns.yyyy;
  vec4 y=y_*ns.x+ns.yyyy;
  vec4 h=1.-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy);
  vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.+1.;
  vec4 s1=floor(b1)*2.+1.;
  vec4 sh=-step(h,vec4(0.));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy;
  vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x);
  vec3 p1=vec3(a0.zw,h.y);
  vec3 p2=vec3(a1.xy,h.z);
  vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=_tiSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.);
  m=m*m;
  return 42.*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}`;

// ── Blob vertex: Simplex-noise displacement ──────────────────────────────────
const BLOB_VERT = `
${SIMPLEX3}
uniform float time;
varying vec3 vN;
varying vec3 vP;
void main(){
  vec3 p=position;
  float d= snoise(p*2.0 +time*0.35)*0.20
          +snoise(p*4.2 -time*0.55)*0.10
          +snoise(p*9.0 +time*1.10)*0.04;
  vec3 disp=p+normal*d;
  vN=normalize(normalMatrix*normal);
  vP=disp;
  gl_Position=projectionMatrix*modelViewMatrix*vec4(disp,1.);
}`;

const BLOB_FRAG = `
uniform float time;
varying vec3 vN;
varying vec3 vP;
void main(){
  vec3 vd=normalize(-vP);
  float rim=1.-max(dot(vN,vd),0.);
  rim=pow(rim,1.7);
  float pulse=.5+.5*sin(time*3.2);
  vec3 hot  =vec3(1.,.97,.65);
  vec3 mid  =vec3(1.,.58,.04);
  vec3 outer=vec3(.88,.22,.0);
  vec3 col=mix(hot,mid,rim);
  col=mix(col,outer,rim*rim);
  col+=pulse*.18*hot;
  float a=.55+.45*(1.-rim*.6);
  gl_FragColor=vec4(col*a,a);
}`;

// ── Ring vertex / fragment ───────────────────────────────────────────────────
const RING_VERT = `
varying vec2 vUv;
void main(){
  vUv=uv;
  gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);
}`;
const RING_FRAG = `
uniform float time;
uniform float spd;
uniform float off;
varying vec2 vUv;
void main(){
  float td=abs(vUv.y-.5)*2.;
  float glow=pow(1.-smoothstep(0.,1.,td),1.3);
  float u=fract(vUv.x+time*spd+off);
  float s1=exp(-pow(u-.5,2.)*50.);
  float s2=exp(-pow(fract(u+.5)-.5,2.)*50.);
  vec3 base=vec3(1.,.58,.04);
  vec3 hot =vec3(1.,.96,.55);
  vec3 col=mix(base,hot,s1+s2*.6);
  float a=glow*(.3+.7*(s1+s2));
  gl_FragColor=vec4(col,a);
}`;

// ── Particle vertex / fragment ───────────────────────────────────────────────
const PART_VERT = `
${SIMPLEX3}
uniform float time;
uniform float dpr;
attribute float aSize;
attribute float aPhase;
attribute float aLayer;
varying vec3 vCol;
varying float vA;
void main(){
  vec3 pos=position;
  if(aLayer<1.5){
    // Blob cloud: noise ripple
    float n=snoise(pos*3.+time*.9);
    pos+=normalize(pos)*n*.07;
  } else if(aLayer<2.5){
    // Orbital: rotate around Y
    float ang=time*.25*(aPhase>.5?1.:-1.)+aPhase*6.28318;
    float ca=cos(ang),sa=sin(ang);
    vec2 xz=vec2(ca*pos.x-sa*pos.z,sa*pos.x+ca*pos.z);
    pos.x=xz.x;pos.z=xz.y;
  } else if(aLayer<3.5){
    // Shell: slow drift
    float n=snoise(pos*1.5+time*.4)*.06;
    pos+=normalize(pos)*n;
  } else {
    // Halo: large soft bloom particles
    float n=snoise(pos*1.+time*.2)*.04;
    pos+=normalize(pos)*n;
  }
  float flk=.55+.45*sin(time*(1.5+aPhase)+aPhase*6.28318);
  vA=flk;
  vec4 mv=modelViewMatrix*vec4(pos,1.);
  gl_PointSize=aSize*dpr*(360./(- mv.z));
  gl_Position=projectionMatrix*mv;
  // Layer colour
  if(aLayer<1.5)      vCol=mix(vec3(1.,.96,.6),vec3(1.,.7,.1),aPhase);
  else if(aLayer<2.5) vCol=mix(vec3(1.,.6,.04),vec3(1.,.82,.15),flk);
  else if(aLayer<3.5) vCol=mix(vec3(.9,.28,.0),vec3(1.,.55,.0),aPhase);
  else                vCol=mix(vec3(1.,.75,.2),vec3(1.,.5,.02),aPhase);
}`;
const PART_FRAG = `
uniform sampler2D uSpr;
varying vec3 vCol;
varying float vA;
void main(){
  vec4 s=texture2D(uSpr,gl_PointCoord);
  if(s.a<.005)discard;
  gl_FragColor=vec4(vCol,s.a*vA);
}`;
const HALO_FRAG = `
uniform sampler2D uSpr;
varying vec3 vCol;
varying float vA;
void main(){
  vec4 s=texture2D(uSpr,gl_PointCoord);
  if(s.a<.005)discard;
  gl_FragColor=vec4(vCol,s.a*vA*.07);
}`;

// ─────────────────────────────────────────────────────────────────────────────
//  RENDERER + SCENE
// ─────────────────────────────────────────────────────────────────────────────
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setClearColor(0x040610,1);
document.body.prepend(renderer.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x040610,.035);

const camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,.1,500);
camera.position.z=4.8;

// ─────────────────────────────────────────────────────────────────────────────
//  LIGHTING
// ─────────────────────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x070715,2));
const coreLight=new THREE.PointLight(0xffcc44,9,12);
scene.add(coreLight);
const blueLight=new THREE.PointLight(0x223acc,3,15);
blueLight.position.set(-6,3,-5);
scene.add(blueLight);
const rimLight=new THREE.PointLight(0xff7700,2,10);
rimLight.position.set(4,-2,2);
scene.add(rimLight);

// ─────────────────────────────────────────────────────────────────────────────
//  TEXTURES
// ─────────────────────────────────────────────────────────────────────────────
function makeSprite(sz=128){
  const c=document.createElement('canvas');
  c.width=c.height=sz;
  const ctx=c.getContext('2d');
  const g=ctx.createRadialGradient(sz/2,sz/2,0,sz/2,sz/2,sz/2);
  g.addColorStop(0,   'rgba(255,245,190,1)');
  g.addColorStop(.18, 'rgba(255,210,80,1)');
  g.addColorStop(.40, 'rgba(255,120,10,.65)');
  g.addColorStop(.70, 'rgba(255,50,0,.25)');
  g.addColorStop(1,   'rgba(200,20,0,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,sz,sz);
  return new THREE.CanvasTexture(c);
}

const sprite=makeSprite(128);
const dpr=renderer.getPixelRatio();

// ─────────────────────────────────────────────────────────────────────────────
//  ORB ROOT
// ─────────────────────────────────────────────────────────────────────────────
const orb=new THREE.Group();
scene.add(orb);

// ─────────────────────────────────────────────────────────────────────────────
//  BLOB CORE
// ─────────────────────────────────────────────────────────────────────────────
const blobUni={time:{value:0}};
const blob=new THREE.Mesh(
  new THREE.SphereGeometry(.44,96,96),
  new THREE.ShaderMaterial({
    vertexShader:BLOB_VERT,fragmentShader:BLOB_FRAG,
    uniforms:blobUni,transparent:true,
    blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide
  })
);
orb.add(blob);

// White-hot nucleus
const nucleus=new THREE.Mesh(
  new THREE.SphereGeometry(.07,16,16),
  new THREE.MeshBasicMaterial({color:0xffffff})
);
orb.add(nucleus);

// Additive glow halos
[[.10,0xfff0b0,.32],[.20,0xffcc44,.22],[.36,0xff8800,.12],[.58,0xff4400,.06],[.90,0xff2200,.025]]
.forEach(([r,col,op])=>{
  orb.add(new THREE.Mesh(
    new THREE.SphereGeometry(r,24,24),
    new THREE.MeshBasicMaterial({
      color:col,transparent:true,opacity:op,
      blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.BackSide
    })
  ));
});

// ─────────────────────────────────────────────────────────────────────────────
//  RINGS
// ─────────────────────────────────────────────────────────────────────────────
const P=Math.PI;
const RINGS_CFG=[
  {r:.58, tb:.030, tilt:[0,0,0],              spd:.18,  off:.0},
  {r:.72, tb:.022, tilt:[P/2,0,0],            spd:-.14, off:.3},
  {r:.72, tb:.018, tilt:[0,0,P/3],            spd:.20,  off:.6},
  {r:.90, tb:.024, tilt:[P/5,0,0],            spd:-.11, off:.1},
  {r:.90, tb:.016, tilt:[0,P/4,0],            spd:.15,  off:.5},
  {r:1.08,tb:.020, tilt:[P/3.5,0,0],          spd:-.09, off:.2},
  {r:1.08,tb:.013, tilt:[0,0,P/4.5],          spd:.12,  off:.7},
  {r:1.26,tb:.018, tilt:[P/5,P/5,0],          spd:.08,  off:.4},
  {r:1.26,tb:.011, tilt:[0,P/3,P/5],          spd:-.07, off:.8},
  {r:1.44,tb:.015, tilt:[P/6,0,P/7],          spd:.06,  off:.0},
];

const ringUnis=[];
const rings=RINGS_CFG.map(({r,tb,tilt,spd,off})=>{
  const u={time:{value:0},spd:{value:spd},off:{value:off}};
  ringUnis.push(u);
  const m=new THREE.Mesh(
    new THREE.TorusGeometry(r,tb,20,220),
    new THREE.ShaderMaterial({
      vertexShader:RING_VERT,fragmentShader:RING_FRAG,
      uniforms:u,transparent:true,
      blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide
    })
  );
  m.rotation.set(...tilt);
  m.userData.rspd=spd*2.5;
  orb.add(m);
  return m;
});

// ─────────────────────────────────────────────────────────────────────────────
//  LATTICE WIREFRAME
// ─────────────────────────────────────────────────────────────────────────────
function lattice(radius,lats,lons,op){
  const g=new THREE.Group();
  const lm=new THREE.LineBasicMaterial({
    color:0xffcc44,transparent:true,opacity:op,
    blending:THREE.AdditiveBlending,depthWrite:false
  });
  for(let i=1;i<lats;i++){
    const phi=(i/lats)*P-P/2;
    const r=Math.cos(phi)*radius,y=Math.sin(phi)*radius;
    const pts=[];
    for(let j=0;j<=80;j++){
      const a=(j/80)*P*2;
      pts.push(new THREE.Vector3(Math.cos(a)*r,y,Math.sin(a)*r));
    }
    g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),lm));
  }
  for(let i=0;i<lons;i++){
    const l=(i/lons)*P*2;
    const pts=[];
    for(let j=0;j<=40;j++){
      const phi=(j/40)*P-P/2;
      pts.push(new THREE.Vector3(
        Math.cos(phi)*Math.cos(l)*radius,
        Math.sin(phi)*radius,
        Math.cos(phi)*Math.sin(l)*radius
      ));
    }
    g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),lm.clone()));
  }
  return g;
}

const lat1=lattice(.88,10,16,.20);lat1.userData.spd={x:.07,y:.10};orb.add(lat1);
const lat2=lattice(1.38,7,12,.07);lat2.userData.spd={x:-.05,y:.07};orb.add(lat2);

// ─────────────────────────────────────────────────────────────────────────────
//  CIRCUIT FRAGMENTS (on sphere surface)
// ─────────────────────────────────────────────────────────────────────────────
const circuits=new THREE.Group();
const cmat=new THREE.LineBasicMaterial({
  color:0xffcc44,transparent:true,opacity:.55,
  blending:THREE.AdditiveBlending,depthWrite:false
});
for(let i=0;i<90;i++){
  const rad=.62+Math.random()*.88;
  const phi=Math.random()*P*2,theta=Math.random()*P;
  const ox=Math.sin(theta)*Math.cos(phi)*rad;
  const oy=Math.cos(theta)*rad;
  const oz=Math.sin(theta)*Math.sin(phi)*rad;
  const frag=new THREE.Group();
  const steps=3+Math.floor(Math.random()*5);
  const pts=[new THREE.Vector3(0,0,0)];
  let cx=0,cy=0;
  for(let s=0;s<steps;s++){
    const axis=Math.random()<.5?'x':'y';
    const d=(.03+Math.random()*.11)*(Math.random()<.5?1:-1);
    if(axis==='x')cx+=d;else cy+=d;
    pts.push(new THREE.Vector3(cx,cy,0));
  }
  frag.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),cmat));
  [pts[0],pts[pts.length-1]].forEach(p=>{
    const dot=new THREE.Mesh(
      new THREE.SphereGeometry(.007,4,4),
      new THREE.MeshBasicMaterial({
        color:0xffcc44,blending:THREE.AdditiveBlending,depthWrite:false
      })
    );
    dot.position.copy(p);frag.add(dot);
  });
  frag.position.set(ox,oy,oz);
  frag.lookAt(0,0,0);frag.rotateY(P);
  circuits.add(frag);
}
circuits.userData.spd={x:.04,y:.06};
orb.add(circuits);

// ─────────────────────────────────────────────────────────────────────────────
//  PARTICLE SYSTEMS (5000+8000+5000+2000 = 20000)
// ─────────────────────────────────────────────────────────────────────────────
function buildPGeo(n,rMin,rMax,layer,sMin,sMax){
  const pos=new Float32Array(n*3);
  const aSz=new Float32Array(n);
  const aPh=new Float32Array(n);
  const aLy=new Float32Array(n);
  for(let i=0;i<n;i++){
    const r=rMin+Math.random()*(rMax-rMin);
    const th=Math.acos(2*Math.random()-1);
    const ph=Math.random()*P*2;
    pos[i*3]  =r*Math.sin(th)*Math.cos(ph);
    pos[i*3+1]=r*Math.cos(th);
    pos[i*3+2]=r*Math.sin(th)*Math.sin(ph);
    aSz[i]=sMin+Math.random()*(sMax-sMin);
    aPh[i]=Math.random();
    aLy[i]=layer;
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('aSize',   new THREE.BufferAttribute(aSz,1));
  geo.setAttribute('aPhase',  new THREE.BufferAttribute(aPh,1));
  geo.setAttribute('aLayer',  new THREE.BufferAttribute(aLy,1));
  return geo;
}

const pUni={time:{value:0},uSpr:{value:sprite},dpr:{value:dpr}};

function pMat(frag){
  return new THREE.ShaderMaterial({
    vertexShader:PART_VERT,fragmentShader:frag,uniforms:pUni,
    transparent:true,blending:THREE.AdditiveBlending,depthWrite:false
  });
}

orb.add(new THREE.Points(buildPGeo(6000, .28,.62, 1, .011,.009),pMat(PART_FRAG)));// blob cloud
orb.add(new THREE.Points(buildPGeo(8000, .55,1.18,2, .009,.007),pMat(PART_FRAG)));// orbital stream
orb.add(new THREE.Points(buildPGeo(4000,1.05,1.55,3, .007,.005),pMat(PART_FRAG)));// outer shell
orb.add(new THREE.Points(buildPGeo(2000, .25,1.55,4, .055,.035),pMat(HALO_FRAG)));// bloom halo

// ─────────────────────────────────────────────────────────────────────────────
//  ENERGY STREAKS
// ─────────────────────────────────────────────────────────────────────────────
const streaks=new THREE.Group();
const smat=new THREE.LineBasicMaterial({
  color:0xffcc44,transparent:true,opacity:.22,
  blending:THREE.AdditiveBlending,depthWrite:false
});
for(let i=0;i<70;i++){
  const ph=Math.random()*P*2,th=Math.acos(2*Math.random()-1);
  const dir=new THREE.Vector3(Math.sin(th)*Math.cos(ph),Math.cos(th),Math.sin(th)*Math.sin(ph));
  const r1=1.5+Math.random()*.4;
  const rnd=()=>(Math.random()-.5)*.3;
  const pts=new THREE.CatmullRomCurve3([
    dir.clone().multiplyScalar(.2),
    dir.clone().multiplyScalar(.2+r1*.33).add(new THREE.Vector3(rnd(),rnd(),rnd())),
    dir.clone().multiplyScalar(.2+r1*.66).add(new THREE.Vector3(rnd(),rnd(),rnd())),
    dir.clone().multiplyScalar(r1)
  ]).getPoints(32);
  streaks.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),smat));
}
streaks.userData.spd={x:.025,y:-.04};
orb.add(streaks);

// ─────────────────────────────────────────────────────────────────────────────
//  STARS
// ─────────────────────────────────────────────────────────────────────────────
(()=>{
  const n=2500,sp=new Float32Array(n*3),sc=new Float32Array(n*3);
  for(let i=0;i<n;i++){
    const r=28+Math.random()*28;
    const t=Math.acos(2*Math.random()-1),p=Math.random()*P*2;
    sp[i*3]=r*Math.sin(t)*Math.cos(p);
    sp[i*3+1]=r*Math.cos(t);
    sp[i*3+2]=r*Math.sin(t)*Math.sin(p);
    const b=Math.random()<.4;
    sc[i*3]=b?.35:1;sc[i*3+1]=b?.55:.9;sc[i*3+2]=b?1:.5;
  }
  const sg=new THREE.BufferGeometry();
  sg.setAttribute('position',new THREE.BufferAttribute(sp,3));
  sg.setAttribute('color',new THREE.BufferAttribute(sc,3));
  scene.add(new THREE.Points(sg,new THREE.PointsMaterial({
    size:.1,vertexColors:true,transparent:true,opacity:.45
  })));
})();

// ─────────────────────────────────────────────────────────────────────────────
//  MOUSE / INTERACTION
// ─────────────────────────────────────────────────────────────────────────────
let drag=false,pm={x:0,y:0};
let tRot={x:0,y:0},cRot={x:0,y:0};
let autoRot=true,autoAng=0;
let zT=4.8,zC=4.8;
let pActive=false,pT=0;
const pRings=[];

const el=id=>document.getElementById(id);

document.addEventListener('mousedown',e=>{
  drag=true;autoRot=false;pm={x:e.clientX,y:e.clientY};
  el('rot-val').textContent='MANUAL';el('mode-val').textContent='CONTROL';
});
document.addEventListener('mousemove',e=>{
  el('cx').textContent=((e.clientX/innerWidth-.5)*2).toFixed(3);
  el('cy').textContent=((e.clientY/innerHeight-.5)*-2).toFixed(3);
  if(!drag)return;
  tRot.y+=(e.clientX-pm.x)*.005;
  tRot.x+=(e.clientY-pm.y)*.005;
  pm={x:e.clientX,y:e.clientY};
});
document.addEventListener('mouseup',()=>{
  drag=false;
  setTimeout(()=>{autoRot=true;el('rot-val').textContent='AUTO ROTATE';el('mode-val').textContent='ANALYSE';},3000);
});
document.addEventListener('wheel',e=>{
  zT=Math.max(2,Math.min(8,zT+e.deltaY*.004));
},{passive:true});
document.addEventListener('click',()=>{pActive=true;pT=0;});

// Touch support
document.addEventListener('touchstart',e=>{
  if(e.touches.length===1){drag=true;autoRot=false;pm={x:e.touches[0].clientX,y:e.touches[0].clientY};}
},{passive:true});
document.addEventListener('touchmove',e=>{
  if(!drag||e.touches.length!==1)return;
  tRot.y+=(e.touches[0].clientX-pm.x)*.005;
  tRot.x+=(e.touches[0].clientY-pm.y)*.005;
  pm={x:e.touches[0].clientX,y:e.touches[0].clientY};
},{passive:true});
document.addEventListener('touchend',()=>{
  drag=false;setTimeout(()=>{autoRot=true;},3000);
});

function spawnPulse(){
  const ring=new THREE.Mesh(
    new THREE.RingGeometry(.03,.07,64),
    new THREE.MeshBasicMaterial({
      color:0xffcc44,transparent:true,opacity:1,
      side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false
    })
  );
  ring.userData.born=Date.now();
  scene.add(ring);pRings.push(ring);
}

// ─────────────────────────────────────────────────────────────────────────────
//  HUD TICKER
// ─────────────────────────────────────────────────────────────────────────────
let hudT=0;
function updateHUD(dt){
  hudT+=dt;
  if(hudT>.22){
    hudT=0;
    const nv=(78+Math.random()*10)|0,sv=(55+Math.random()*18)|0,mv=(88+Math.random()*8)|0;
    el('net-val').textContent=nv+'%';el('scn-val').textContent=sv+'%';el('mem-val').textContent=mv+'%';
    el('net-bar').style.width=nv+'%';el('scn-bar').style.width=sv+'%';el('mem-bar').style.width=mv+'%';
    el('energy').textContent=(3.5+Math.random()*.65).toFixed(2);
    el('temp').textContent=(8350+Math.random()*280|0);
    el('freq').textContent=(2.38+Math.random()*.28).toFixed(2);
  }
}

// ─────────────────────────────────────────────────────────────────────────────
//  ANIMATE
// ─────────────────────────────────────────────────────────────────────────────
const clock=new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const dt=clock.getDelta();
  const t=clock.getElapsedTime();

  // Update shader uniforms
  blobUni.time.value=t;
  pUni.time.value=t;
  ringUnis.forEach(u=>u.time.value=t);

  // Auto-rotate
  if(autoRot){
    autoAng+=dt*.16;
    tRot.y=autoAng;
    tRot.x=Math.sin(t*.13)*.18;
  }
  cRot.x+=(tRot.x-cRot.x)*.045;
  cRot.y+=(tRot.y-cRot.y)*.045;
  orb.rotation.x=cRot.x;
  orb.rotation.y=cRot.y;

  // Zoom
  zC+=(zT-zC)*.055;
  camera.position.z=zC;

  // Rings spin
  rings.forEach(r=>{r.rotation.z+=r.userData.rspd*dt;});

  // Lattice + streaks + circuits spin
  [lat1,lat2,streaks,circuits].forEach(g=>{
    g.rotation.x+=(g.userData.spd.x||0)*dt;
    g.rotation.y+=(g.userData.spd.y||0)*dt;
  });

  // Core pulse
  const ps=1+Math.sin(t*4.2)*.1;
  nucleus.scale.setScalar(ps);
  coreLight.intensity=8+Math.sin(t*3.1)*3.5;

  // Pulse rings
  if(pActive){
    pT+=dt;
    if(pT<.12)spawnPulse();
    if(pT>.55)pActive=false;
  }
  for(let i=pRings.length-1;i>=0;i--){
    const pr=pRings[i];
    const prog=(Date.now()-pr.userData.born)/1300;
    pr.scale.setScalar(1+prog*24);
    pr.material.opacity=.85*(1-prog);
    pr.rotation.x=cRot.x;pr.rotation.y=cRot.y;
    if(prog>=1){scene.remove(pr);pRings.splice(i,1);}
  }

  updateHUD(dt);
  renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
